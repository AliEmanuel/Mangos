<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mangos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mangos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a centred column (empty top bar with menu, new and more buttons; scrolling ledger; strip of round amounts) over three separate footer bubbles (total on top, positive and negative side by side). The footer collapses while a text field is focused so the keyboard has room. Side panels: drawer of apartados, trash overlay, small dialog. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e3e8f0; --ink:#17202d; --muted:#586577; --line:#d2d9e4;
  --accent:#2b52c9; --accent-ink:#ffffff;
  --gain:#187f46; --gain-text:#12683a;
  --loss:#c93232; --loss-text:#b02525;
  --warn-bg:#fff0d6; --warn-ink:#7a4a00; --warn-dot:#d98a00;
  --shadow:0 1px 2px rgba(23,32,45,.08),0 8px 22px rgba(23,32,45,.14);
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-brand:'Bricolage Grotesque','Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#161d27; --surface2:#212b38; --ink:#e7ecf3; --muted:#95a2b5; --line:#2b3748;
    --accent:#8aa9ff; --accent-ink:#0e131a;
    --gain:#1a8449; --gain-text:#5fd493;
    --loss:#c93232; --loss-text:#ff8f8f;
    --warn-bg:#3a2a0c; --warn-ink:#ffcf7a; --warn-dot:#e0a030;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --surface2:#212b38; --ink:#e7ecf3; --muted:#95a2b5; --line:#2b3748;
  --accent:#8aa9ff; --accent-ink:#0e131a;
  --gain:#1a8449; --gain-text:#5fd493;
  --loss:#c93232; --loss-text:#ff8f8f;
  --warn-bg:#3a2a0c; --warn-ink:#ffcf7a; --warn-dot:#e0a030;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .12s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease}
button:active:not(:disabled){transform:scale(.95)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@keyframes rise{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes rowin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadedown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes lift{from{transform:scale(.985)}60%{transform:scale(1.012)}to{transform:scale(1)}}
@keyframes sqin{from{transform:scale(.15);opacity:0}to{transform:none;opacity:1}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* layout */
.shell{height:100%;display:flex;flex-direction:column}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin-inline:auto;padding:10px 16px 8px;position:relative}

/* top bar: menu on the left, new and more on the right, nothing in the middle */
.top{display:flex;align-items:center;gap:8px;min-height:52px;flex:none}
.top .grow{flex:1}
.ib{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.ib svg{width:22px;height:22px}
.ib.sm{width:38px;height:38px;border-radius:10px;border:0;background:transparent}
.ib.sm svg{width:19px;height:19px}
.ib.warn::after{content:"";position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--warn-dot);border:2px solid var(--surface)}
.ib[hidden]{display:none}
.shell.ready .top{animation:fadedown .45s cubic-bezier(.2,.8,.2,1) backwards}
.st{margin:0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gain);flex:none;transition:background-color .3s}
.st.warn::before{background:var(--warn-dot)}
.st.busy::before{background:var(--accent);animation:pulse 1s ease-in-out infinite}

.banner{flex:none;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;animation:fadedown .25s ease-out}
.banner[hidden]{display:none}

/* list */
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;padding-block:2px}
.hint{margin:0 0 2px;font-size:12px;color:var(--muted)}
.day{position:sticky;top:0;margin:8px 0 0;padding:5px 0;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);background:var(--bg);z-index:1;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;flex-direction:column;gap:8px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none;position:relative;transition:transform .35s ease,border-color .2s ease,box-shadow .2s ease}
.row.pressing{transform:scale(.982)}
.row.sel{border-color:var(--accent);box-shadow:var(--shadow)}
.row.flash{animation:rowin .34s cubic-bezier(.2,.9,.3,1.1)}
.row.enter{animation:fadeup .34s backwards;animation-delay:calc(var(--i,0)*30ms)}
.row.selin{animation:lift .26s cubic-bezier(.2,.9,.3,1.2)}
.row.selin .detail{animation:fadedown .26s .05s backwards}
.row.out{overflow:hidden;max-height:0!important;opacity:0;transform:translateX(34px);padding-block:0;margin-block:-3px;border-width:0;transition:max-height .26s ease,opacity .2s ease,transform .26s ease,padding .26s ease,margin .26s ease,border-width .26s ease}
.rl{display:flex;align-items:center;gap:10px;min-width:0}
.amtw{min-width:0;flex:0 1 auto}
.amt{display:flex;flex-wrap:wrap;overflow:hidden;font:600 24px/1.2 var(--f-num);padding-block:3px;font-variant-numeric:tabular-nums;transition:color .3s ease}
.amt .g{display:inline-flex;white-space:nowrap}
.amt.pos{color:var(--gain-text)}
.amt.neg{color:var(--loss-text)}
.ch{display:inline-block}
.amt.anim .ch,.sp-name .ch{animation:rise .42s cubic-bezier(.2,.8,.25,1) backwards;animation-delay:calc(var(--i)*var(--g,80ms))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.when{margin-left:auto;font-family:var(--f-num);font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:6px;flex:none}
.when small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted)}
.note{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note.none{color:var(--muted);font-size:13px}
.detail{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.editor{display:flex;flex-direction:column;gap:8px;animation:fadedown .22s ease-out}
.editor textarea{width:100%;min-height:72px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical;user-select:text;-webkit-user-select:text}
.ef{display:flex;align-items:center;gap:8px}
.ef .sg{font:700 22px var(--f-num);flex:none}
.ef .sg.pos{color:var(--gain-text)}
.ef .sg.neg{color:var(--loss-text)}
.ef input{flex:1;min-width:0;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding-inline:12px;font:600 20px var(--f-num);user-select:text;-webkit-user-select:text}
.eb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{margin:auto;max-width:30ch;text-align:center;color:var(--muted);padding-block:24px;animation:fadeup .4s ease-out}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.ecoin{width:76px;height:76px;margin:0 auto 12px;animation:float 3.4s ease-in-out infinite}
.ecoin svg{width:100%;height:100%;display:block}
.sk{height:50px;flex:none;border-radius:14px;border:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}

/* combined view */
.card{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.card.enter{animation:fadeup .34s backwards;animation-delay:calc(var(--i,0)*60ms)}
.cn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-family:var(--f-num);font-weight:600;font-size:17px;overflow-wrap:anywhere;text-align:right}
.ct.pos,.gp{color:var(--gain-text)}
.ct.neg,.ln{color:var(--loss-text)}
.cs{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.cs span{font-family:var(--f-num);font-weight:600}
.cs.r{text-align:right}

/* bubbles (hold menus and amount confirm) */
.bubble,.pop{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:100%;
  opacity:0;transform:scale(.55);visibility:hidden;transform-origin:var(--ax,24px) 100%;
  transition:opacity .12s ease,transform .16s cubic-bezier(.2,.9,.3,1.25),visibility 0s .16s}
.bubble.show,.pop.show{opacity:1;transform:none;visibility:visible;transition:opacity .12s ease,transform .2s cubic-bezier(.2,.9,.3,1.3),visibility 0s}
.bubble.below{transform-origin:var(--ax,24px) 0}
.bubble::after,.pop::after{content:"";position:absolute;top:100%;left:var(--ax,24px);width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
.bubble.below::after{top:auto;bottom:100%;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translate(-50%,6px) rotate(45deg)}
.bb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;height:54px;padding:4px 6px;border:0;border-radius:11px;background:transparent;font-size:11px;font-weight:600;white-space:nowrap}
.bb svg{width:21px;height:21px}
.bb.del svg{color:var(--loss-text)}
.bb:active:not(:disabled){background:var(--surface2)}
.bb.arm{background:var(--loss);color:#fff}
.bb.arm svg{color:#fff}

/* amount strip */
.composer{position:relative;flex:none}
.pop{flex-wrap:wrap;bottom:calc(100% + 6px);left:0;padding:8px;gap:8px}
.strip{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:6px 16px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 28px),transparent 100%)}
.strip::-webkit-scrollbar{display:none}
.chip-n{flex:none;height:48px;min-width:64px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:600 16px var(--f-num);color:var(--ink);display:grid;place-items:center;transition:transform .15s cubic-bezier(.2,.9,.3,1.3),background-color .15s ease,border-color .15s ease,color .15s ease}
.shell.ready .chip-n{animation:fadeup .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*30ms + .12s)}
.chip-n svg{width:20px;height:20px}
.chip-n.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-2px) scale(1.05)}
.pv{font:600 18px var(--f-num);padding-inline:6px;white-space:nowrap}
.pop input{height:44px;width:150px;min-width:0;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding-inline:10px;font:600 17px var(--f-num)}
.sq{width:44px;height:44px;border-radius:10px;border:0;color:#fff;font:700 26px/1 var(--f-num);padding:0}
.sq.g{background:var(--gain)}
.sq.r{background:var(--loss)}
.pop.show .sq{animation:sqin .18s cubic-bezier(.2,.9,.3,1.35) backwards}
.perr{flex-basis:100%;margin:0;font-size:12px;color:var(--loss-text)}
.perr[hidden]{display:none}

/* footer: three separate bubbles; collapses while the keyboard is up */
.foot{flex:none;width:100%;display:flex;flex-direction:column;gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));overflow:hidden;transition:height .3s cubic-bezier(.2,.8,.2,1),opacity .22s ease,transform .3s ease,padding .3s ease}
.foot.hide{opacity:0;transform:translateY(18px);padding-bottom:0;pointer-events:none}
.shell.ready .foot>*{animation:fadeup .5s cubic-bezier(.2,.8,.2,1) backwards}
.shell.ready .foot>.pn{animation-delay:.09s}
.tot{min-height:68px;border-radius:16px;background:var(--surface2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 14px;box-shadow:0 8px 18px -10px rgba(0,0,0,.45);transition:background-color .4s ease,color .4s ease}
.tot.pos{background:var(--gain);color:#fff}
.tot.neg{background:var(--loss);color:#fff}
.tot small{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.9}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cell{min-height:54px;min-width:0;border-radius:16px;padding:8px 12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.cell.p{background:var(--gain)}
.cell.n{background:var(--loss)}
.roll{position:relative;width:100%;overflow:hidden;font:600 22px var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;height:30px;transition:height .3s ease}
.rv{position:absolute;inset:0;display:grid;place-items:center;white-space:nowrap}
.rv i{font-style:normal;display:inline-block}
.rv i.wrap{display:block;white-space:normal;max-width:100%;text-align:center;line-height:1.2}

/* buttons */
.btn{height:46px;padding-inline:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:19px;height:19px;flex:none}
.btn.sm{height:40px;padding-inline:14px;border-color:currentColor;background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.dangerline{color:var(--loss-text)}
.btn.wide{width:100%;justify-content:space-between}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cnt{min-width:24px;height:24px;border-radius:12px;background:var(--surface2);display:inline-grid;place-items:center;padding-inline:7px;font-size:13px}
.cnt:empty{display:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:20;opacity:0;visibility:hidden;transition:opacity .24s ease,visibility 0s .24s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .24s ease,visibility 0s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(90vw,380px);background:var(--bg);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-104%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:46px;height:46px;flex:none;overflow:visible}
.brand b{display:block;font:800 22px/1.1 var(--f-brand);letter-spacing:-.01em}
.books{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.books.anim .book{animation:fadeup .3s backwards;animation-delay:calc(var(--i,0)*40ms + .1s)}
.book{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;transition:border-color .2s ease,transform .3s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.book.on{border-color:var(--accent)}
.book.pressing{transform:scale(.98)}
.bname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px;display:flex;flex-direction:column;gap:2px}
.bname .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname .pn{display:inline-block;color:var(--muted)}
.bname .pn svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.bal{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal.pos{color:var(--gain-text)}
.bal.neg{color:var(--loss-text)}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.sec p{margin:0;font-size:13px;color:var(--muted)}
.sec .eb{justify-content:flex-start}

/* more menu (3 dots) */
.mscrim{position:fixed;inset:0;z-index:22;background:transparent}
.mscrim[hidden]{display:none}
.menu{position:fixed;z-index:23;min-width:210px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.88) translateY(-6px);transform-origin:top right;transition:opacity .12s ease,transform .18s cubic-bezier(.2,.9,.3,1.25),visibility 0s .18s}
.menu.show{opacity:1;visibility:visible;transform:none;transition:opacity .12s ease,transform .22s cubic-bezier(.2,.9,.3,1.25),visibility 0s}
.mi{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:15px;text-align:left;width:100%}
.mi svg{width:20px;height:20px;flex:none}
.mi:active{background:var(--surface2)}
.mi.del{color:var(--loss-text)}

/* dialog */
.dlgwrap{position:fixed;inset:0;z-index:40;display:grid;place-items:start center;padding:16vh 16px 16px;background:rgba(8,12,18,.5);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
.dlgwrap.open{opacity:1;visibility:visible;transition:opacity .2s ease,visibility 0s}
.dlg{width:min(100%,380px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transform:scale(.92) translateY(12px);transition:transform .24s cubic-bezier(.2,.9,.3,1.2)}
.dlgwrap.open .dlg{transform:none}
.dlg h2{margin:0;font:800 20px var(--f-brand)}
.dlg input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding-inline:12px;font:inherit;font-size:16px}

/* trash overlay */
.trash{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.trash.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.tin{max-width:560px;margin-inline:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.th{display:flex;align-items:center;gap:10px;min-height:52px}

/* ---------- money: integer centavos as BigInt, so there is no upper limit ---------- */

  let s=String(raw||'').trim().toLowerCase().replace(/^[+\-−]/,'').replace(/\$|\s|ars|pesos?/g,'');

function lsSave(){try{localStorage.setItem(LS,JSON.stringify({books:S.books,entries:S.entries,cur:S.cur,trashDays:S.trashDays,pending:Array.from(pending.values())}))}catch(e){}}
const sortBooks=()=>S.books.sort((a,b)=>(a.pin?0:1)-(b.pin?0:1)||(a.pin&&b.pin?a.pin-b.pin:0)||(a.ts||0)-(b.ts||0)||String(a.name).localeCompare(String(b.name)));

function sums(ids){

  S.entries.forEach(e=>{if(!e.del&&ids.has(e.book)){const v=cOf(e);if(v>0n)p+=v;else n+=v;c++}});

/* ---------- cloud sync ---------- */
let active=0;const waiting=[];
function gate(fn){return new Promise((res,rej)=>{const run=()=>{active++;fn().then(res,rej).finally(()=>{active--;const n=waiting.shift();if(n)n()})};active<4?run():waiting.push(run)})}
async function retry(fn){
  try{return await fn()}catch(e){
    if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await sleep(600+Math.random()*900);return await fn()}
    throw e;
  }
}
const chains=new Map();
function enqueue(key,fn){
  const prev=chains.get(key)||Promise.resolve();
  const next=prev.then(()=>gate(fn)).catch(e=>{S.err=(e&&e.code)||'error';render()});
  chains.set(key,next);
  next.finally(()=>{if(chains.get(key)===next)chains.delete(key)});
  return next;
}
const ebody=e=>({book:e.book,c:e.c,ts:e.ts,note:e.note||'',del:e.del||0});
const bbody=b=>({name:b.name,ts:b.ts||0,pin:b.pin||0,del:b.del||0});
function writeOne(key,p){
  let col,body;
  if(p.k==='e'){col=ctx.entries;body=ebody(p.o)}
  else if(p.k==='b'){col=ctx.books;body=bbody(p.o)}
  else{col=ctx.meta;body={days:p.o.days}}
  enqueue(key,()=>retry(()=>col.doc(p.o.id).set(body)).then(()=>{
    const cur=pending.get(key);
    if(cur&&cur.o===p.o){pending.delete(key);lsSave()}
    S.err='';renderTop();renderBanner();
  }));
}
function pushPending(){if(ctx)pending.forEach((p,key)=>writeOne(key,p))}
function putEntry(e){const key='e:'+e.id,p={k:'e',o:e};pending.set(key,p);lsSave();if(ctx)writeOne(key,p)}
function putBook(b){const key='b:'+b.id,p={k:'b',o:b};pending.set(key,p);lsSave();if(ctx)writeOne(key,p)}
function putPrefs(){const p={k:'p',o:{id:'prefs',days:S.trashDays}};pending.set('p:prefs',p);lsSave();if(ctx)writeOne('p:prefs',p)}
function dropEntry(id){pending.delete('e:'+id);lsSave();if(ctx)enqueue('e:'+id,()=>retry(()=>ctx.entries.doc(id).delete()))}
function dropBook(id){pending.delete('b:'+id);lsSave();if(ctx)enqueue('b:'+id,()=>retry(()=>ctx.books.doc(id).delete()))}

function goLocal(){S.store='local';pending.clear();lsSave();purgeExpired();render()}
async function initCloud(){
  let t=0;
  if(window.self===window.top&&!window.claude){goLocal();return}
  while(!(window.claude&&window.claude.use)&&t<30){await sleep(100);t++}
  if(!(window.claude&&window.claude.use)){goLocal();return}
  try{
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=res[0],user=res[1];
    const id=user?await user.id():null;
    if(!db||!id){goLocal();return}
    const root=db.doc('data/users/'+id+'/app');
    ctx={books:root.collection('books'),entries:root.collection('entries'),meta:root.collection('meta')};
    S.store='cloud';
    pushPending();
    ctx.books.onSnapshot(s=>{cb=s.docs.map(d=>Object.assign({id:d.id},d.data()));gotB=true;defB=!s.metadata.fromCache;applySnap()},onSubErr);
    ctx.entries.onSnapshot(s=>{rawE=s.docs.length;ce=s.docs.map(d=>normE(Object.assign({id:d.id},d.data()))).filter(Boolean);gotE=true;defE=!s.metadata.fromCache;applySnap()},onSubErr);
    ctx.meta.doc('prefs').onSnapshot(s=>{
      if(s.exists&&!pending.has('p:prefs')){const d=s.data();if(d&&typeof d.days==='number'&&d.days>=0&&d.days!==S.trashDays){S.trashDays=d.days;lsSave();render();purgeExpired()}}
    },onSubErr);
    render();
  }catch(e){goLocal()}
}
function onSubErr(e){S.err=(e&&e.code)||'error';render()}
function applySnap(){
  if(!gotB||!gotE)return;
  const definitive=defB&&defE;
  if(!cb.length&&!rawE){
    if(!definitive)return;
    if(!migrated){migrated=true;S.books.slice().forEach(putBook);S.entries.slice().forEach(putEntry)}
    render();return;
  }
  migrated=true;
  const books=cb.filter(b=>typeof b.name==='string').map(normB);
  const entries=ce.slice();
  pending.forEach(p=>{
    if(p.k==='p')return;
    const arr=p.k==='b'?books:entries;
    const i=arr.findIndex(x=>x.id===p.o.id);
    if(i>=0)arr[i]=p.o;else arr.push(p.o);
  });
  S.books=books;S.entries=entries;sortBooks();
  if(definitive)ensureActive();
  else if(!activeBooks().some(b=>b.id===S.cur)&&activeBooks().length)S.cur=activeBooks()[0].id;
  const se=S.sel?byId(S.sel):null;
  if(S.sel&&(!se||se.del)){S.sel=null;S.editing=false}
  lsSave();render();
  if(definitive)purgeExpired();
}
window.addEventListener('online',()=>{S.err='';pushPending();render()});

/* ---------- trash rules ---------- */
function canPurge(){return S.store==='local'||(S.store==='cloud'&&defB&&defE)}
function purgeBook(id){
  S.entries.filter(e=>e.book===id).forEach(e=>dropEntry(e.id));
  S.entries=S.entries.filter(e=>e.book!==id);
  S.books=S.books.filter(b=>b.id!==id);dropBook(id);S.combo.delete(id);
}
function purgeEntry(id){S.entries=S.entries.filter(e=>e.id!==id);dropEntry(id)}
function purgeExpired(){
  const d=S.trashDays;if(!d||d<=0||!canPurge())return 0;
  const lim=Date.now()-d*DAY;let n=0;
  S.books.filter(b=>b.del&&b.del<lim).forEach(b=>{purgeBook(b.id);n++});
  S.entries.filter(e=>e.del&&e.del<lim).forEach(e=>{purgeEntry(e.id);n++});
  if(n){ensureActive();render()}
  return n;
}
function leftLabel(ts){
  const d=S.trashDays;if(!d)return 'No se borra solo';
  const ms=ts+d*DAY-Date.now();
  if(ms<=DAY)return 'Se borra en menos de 1 día';
  return 'Se borra en '+Math.ceil(ms/DAY)+' días';
}
function retLabel(d){
  if(!d)return 'Nunca';
  if(d%30===0&&d>=30)return d/30===1?'1 mes':(d/30)+' meses';
  if(d%7===0&&d>=7)return d/7===1?'1 semana':(d/7)+' semanas';
  return d===1?'1 día':d+' días';
}

/* ---------- mutations ---------- */
function updateEntry(id,patch){
  const i=S.entries.findIndex(e=>e.id===id);if(i<0)return null;
  const n=Object.assign({},S.entries[i],patch);
  S.entries[i]=n;putEntry(n);return n;
}
function updateBook(id,patch){
  const i=S.books.findIndex(b=>b.id===id);if(i<0)return null;
  const n=Object.assign({},S.books[i],patch);
  S.books[i]=n;sortBooks();putBook(n);return n;
}
function commitPick(sign){
  let q;
  if(S.pick==='custom'){
    const inp=$('customAmt');
    q=parseCents(inp?inp.value:'');
    if(!q){popErr('Escribí un monto, por ejemplo 250.');return}
  }else q=B(Number(S.pick))*100n;
  if(!q||!S.cur)return;
  const e={id:uid(),book:S.cur,c:(B(sign)*q).toString(),ts:Date.now(),note:'',del:0};
  S.entries.push(e);putEntry(e);
  S.sel=null;S.editing=false;S.flash=e.id;wantBottom=true;
  setPick(null);render(true);
}
function openBook(id){
  S.cur=id;S.view='book';S.sel=null;S.editing=false;S.comboMode=false;S.enter=true;wantBottom=true;
  setPick(null);lsSave();closeDrawer();render(true);
}
function createBook(name){
  const b={id:uid(),name:name,ts:Date.now(),pin:0,del:0};
  S.books.push(b);sortBooks();putBook(b);openBook(b.id);
  toast('Apartado «'+name+'» creado.');
}
function trashBook(id){
  const b=bookById(id);if(!b||b.del)return;
  const wasCur=S.cur===id;
  updateBook(id,{del:Date.now(),pin:0});
  S.combo.delete(id);
  if(wasCur){S.sel=null;S.editing=false;S.enter=true;wantBottom=true;setPick(null)}
  if(S.view==='combo'&&comboIds().length<2)S.view='book';
  ensureActive();closeMenu();closeBk();
  render(true);
  toast('«'+b.name+'» fue a la papelera.','Deshacer',()=>restoreBook(id,true));
}
function restoreBook(id,open){
  const b=bookById(id);if(!b)return;
  updateBook(id,{del:0});
  if(open){S.cur=id;S.view='book';S.enter=true;wantBottom=true}
  render(true);
  if(!open)toast('«'+b.name+'» volvió a tus apartados.');
}
function restoreEntry(id){updateEntry(id,{del:0});S.rollId=id;render(true);toast('Movimiento restaurado.')}
function togglePin(id){const b=bookById(id);if(!b)return;updateBook(id,{pin:b.pin?0:Date.now()});closeMenu();closeBk();render()}

/* ---------- toast ---------- */
function toast(msg,label,fn){
  const t=$('toast');clearTimeout(toastTimer);t.hidden=true;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button" id="toastBtn">'+esc(label)+'</button>':'');
  void t.offsetWidth;t.hidden=false;
  if(label){$('toastBtn').onclick=()=>{t.hidden=true;fn()}}
  toastTimer=setTimeout(()=>{t.hidden=true},label?7000:3200);
}

/* ---------- rolling numbers (footer): shrink first, then wrap onto lines ---------- */
function mkRv(){const s=document.createElement('span');s.className='rv';s.appendChild(document.createElement('i'));return s}
function fitInto(box,span,val,base,min){
  const i=span.firstChild,txt=signedC(val).replace(/ /g,' ');
  i.className='';i.textContent=txt;
  box.style.fontSize=base+'px';
  const W=box.clientWidth-6;
  if(W>0){
    const w=i.offsetWidth;
    if(w>W){
      box.style.fontSize=Math.max(min,base*W/w)+'px';
      if(i.offsetWidth>W){i.className='wrap';i.innerHTML=esc(txt).replace(/\./g,'.<wbr>')}
    }
  }
  return Math.ceil(i.offsetHeight)+2;
}
function setRoll(box,val,base,min,still){
  const prev=box._v,old=Array.prototype.slice.call(box.querySelectorAll('.rv'));
  box._v=val;
  if(prev===undefined||still||reduce()||!box.animate){
    old.forEach(o=>o.remove());
    const n=mkRv();box.appendChild(n);box.style.height=fitInto(box,n,val,base,min)+'px';return;
  }
  if(prev===val&&old.length)return;
  const dir=val>prev?1:-1;
  const nxt=mkRv();box.appendChild(nxt);
  box.style.height=fitInto(box,nxt,val,base,min)+'px';
  old.forEach(o=>{
    const a=o.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY('+(-dir*115)+'%)',opacity:0}],{duration:340,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'});
    a.onfinish=()=>o.remove();
  });
  nxt.animate([{transform:'translateY('+(dir*115)+'%)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:400,easing:'cubic-bezier(.2,.9,.25,1)'});
  const host=box.closest('.cell,.tot');
  if(host&&host.animate)host.animate([{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:360,easing:'ease-out'});
}

/* ---------- footer hides while typing so the keyboard has room ---------- */
function setFootHidden(h){
  const f=$('foot');if(f._h===h)return;f._h=h;
  clearTimeout(f._t);
  if(reduce()){f.classList.toggle('hide',h);f.style.height=h?'0px':'';return}
  if(h){
    f.style.height=f.offsetHeight+'px';void f.offsetHeight;
    f.classList.add('hide');f.style.height='0px';
  }else{
    f.classList.remove('hide');
    f.style.height='auto';const th=f.offsetHeight;
    f.style.height='0px';void f.offsetHeight;
    f.style.height=th+'px';
    f._t=setTimeout(()=>{f.style.height='';placePop();placeBubble()},340);
  }
}
const isTxt=n=>!!n&&(n.tagName==='TEXTAREA'||(n.tagName==='INPUT'&&/^(text|number|search|)$/.test(n.type||'')));
const typingMain=()=>{const a=document.activeElement;return isTxt(a)&&$('main').contains(a)};
function syncFoot(){setFootHidden(typingMain())}
let baseH=window.innerHeight,baseW=window.innerWidth,kbSeen=false;
const vv=window.visualViewport;
const kbOpen=()=>!!vv&&vv.height<baseH-110;
document.addEventListener('focusin',()=>{kbSeen=kbOpen();setTimeout(syncFoot,0)});
document.addEventListener('focusout',()=>setTimeout(syncFoot,220));
if(vv)vv.addEventListener('resize',()=>{

  if(vv.height>baseH)baseH=vv.height;

function buildStrip(){
  $('strip').innerHTML='<button type="button" class="chip-n" style="--i:0" data-v="custom" aria-label="Monto personalizado" aria-pressed="false">'+ic.pencil+'</button>'+

function placePop(){
  const pop=$('pop');
  const chip=document.querySelector('#strip .chip-n.on');if(!chip)return;
  const comp=$('composer').getBoundingClientRect(),r=chip.getBoundingClientRect(),pw=pop.offsetWidth;
  const cx=r.left+r.width/2-comp.left;
  const left=Math.max(0,Math.min(cx-pw/2,comp.width-pw));
  pop.style.left=left+'px';
  pop.style.setProperty('--ax',Math.max(16,Math.min(pw-16,cx-left))+'px');
}
function setPick(v){
  S.pick=v;
  const pop=$('pop');
  document.querySelectorAll('#strip .chip-n').forEach(b=>{const on=v!=null&&b.dataset.v===String(v);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
  pop.classList.remove('show');
  if(v==null){pop.setAttribute('aria-hidden','true');return}
  const sq='<button type="button" class="sq g" data-act="commit" data-s="1" aria-label="Gané">+</button><button type="button" class="sq r" data-act="commit" data-s="-1" aria-label="Perdí">−</button>';
  if(v==='custom'){
    pop.innerHTML='<label class="sr" for="customAmt">Monto</label><input id="customAmt" type="text" inputmode="text" autocomplete="off" autocapitalize="off" maxlength="100" placeholder="Ej: 250" enterkeyhint="done">'+sq;
  }else{
    pop.innerHTML='<span class="pv">$ '+fmtC(B(Number(v))*100n)+'</span>'+sq;

/* ---------- hold menu bubble (list rows) ---------- */
function placeBubble(){
  const bub=$('bubble');
  const e=S.view==='book'&&S.sel&&!S.editing&&!S.deleting?byId(S.sel):null;
  const row=e?document.querySelector('#list .row.sel'):null;
  if(!row){bub.classList.remove('show');bub.setAttribute('aria-hidden','true');return}
  $('bbDel').innerHTML=ic.trash+'<span>'+(S.delArm?'¿Seguro?':'Borrar')+'</span>';
  $('bbDel').classList.toggle('arm',S.delArm);
  $('bbEdit').innerHTML=ic.pencil+'<span>Monto</span>';
  $('bbNote').innerHTML=ic.doc+'<span>Nota</span>';
  $('bbFlip').innerHTML=ic.swap+'<span>Pasar a '+(cOf(e)>0n?'−':'+')+'</span>';
  const lr=$('list').getBoundingClientRect(),rr=row.getBoundingClientRect(),mr=$('main').getBoundingClientRect();
  if(rr.bottom<lr.top+10||rr.top>lr.bottom-10){bub.classList.remove('show');return}
  if(bubbleReset){bub.classList.remove('show');void bub.offsetWidth}
  const bw=bub.offsetWidth,bh=bub.offsetHeight;
  const amt=row.querySelector('.amt');
  const ar=(amt||row).getBoundingClientRect();
  const above=rr.top-lr.top>=bh+8;
  const top=above?rr.top-mr.top-bh-8:rr.bottom-mr.top+8;
  const cx=ar.left+Math.min(ar.width/2,60)-mr.left;
  const left=Math.max(0,Math.min(cx-bw/2,mr.width-bw));
  bub.style.top=top+'px';bub.style.left=left+'px';
  bub.style.setProperty('--ax',Math.max(18,Math.min(bw-18,cx-left))+'px');
  bub.classList.toggle('below',!above);
  bub.setAttribute('aria-hidden','false');
  bub.classList.add('show');
  bubbleReset=false;
}

    case 'more':S.menu?closeMenu():openMenu();break;
    case 'menu-close':closeMenu();break;
    case 'cur-rename':openDlg('rename',S.cur);break;
    case 'cur-pin':togglePin(S.cur);break;
    case 'cur-del':trashBook(S.cur);break;
    case 'bk-rename':openDlg('rename',S.bk);break;
    case 'bk-pin':togglePin(S.bk);break;
    case 'bk-del':{const b=S.bk;closeBk();trashBook(b);break}
    case 'dlg-cancel':closeDlg();break;
    case 'trash-open':openTrash();break;
    case 'trash-close':closeTrash();break;
    case 'tr-restore':if(el.dataset.kind==='b')restoreBook(id);else restoreEntry(id);break;
    case 'tr-purge':{
      const key=el.dataset.kind+id;
      if(S.tArm!==key){armT(key);break}
      S.tArm=null;clearTimeout(tArmTimer);
      if(el.dataset.kind==='b'){purgeBook(id);ensureActive()}else purgeEntry(id);
      render(true);toast('Borrado para siempre.');break;
    }
    case 'tr-empty':{
      if(S.tArm!=='all'){armT('all');break}
      S.tArm=null;clearTimeout(tArmTimer);
      const it=trashItems();
      it.bs.forEach(b=>purgeBook(b.id));it.es.forEach(e=>purgeEntry(e.id));
      ensureActive();render(true);toast('Papelera vaciada.');break;
    }
    case 'ret-set':{
      S.retOpen=false;S.trashDays=Number(el.dataset.d);putPrefs();
      const n=purgeExpired();render();
      if(n)toast('Se borraron '+n+' elementos que ya cumplían ese tiempo.');
      break;
    }
    case 'ret-custom':S.retOpen=!S.retOpen;$('retChips')._sig=null;render();break;
    case 'ret-apply':{
      const n=Math.round(Number($('retNum').value)),u=Number($('retUnit').value);
      const days=n*u;
      if(!(n>=1)||days>3650){toast('Poné un tiempo entre 1 día y 10 años.');break}
      S.retOpen=false;S.trashDays=days;putPrefs();
      const m=purgeExpired();$('retChips')._sig=null;render();
      toast(m?'Se borraron '+m+' elementos que ya cumplían ese tiempo.':'Listo, se borra a los '+retLabel(days)+'.');
      break;
    }
    case 'del':{
      const e=byId(S.sel);if(!e||S.deleting)break;
      if(!S.delArm){S.delArm=true;placeBubble();clearTimeout(armTimer);armTimer=setTimeout(()=>{S.delArm=false;placeBubble()},4000)}
      else{
        const row=document.querySelector('#list .row.sel');
        if(row&&!reduce()){
          S.deleting=true;placeBubble();
          row.style.maxHeight=row.offsetHeight+'px';void row.offsetHeight;row.classList.add('out');
          setTimeout(()=>finishDelete(e),270);
        }else finishDelete(e);
      }
      break;
    }
    case 'edit':{
      const e=byId(S.sel);if(!e)break;
      S.delArm=false;S.editing='amt';S.draft=rawC(cOf(e));render(true);focusEditor('amtInput',true);break;
    }
    case 'amt-save':{
      const e=byId(S.sel);if(!e)break;
      const i=$('amtInput');const q=parseCents(i?i.value:S.draft);
      if(!q){const p=$('amtErr');if(p){p.textContent='Escribí un monto, por ejemplo 250.';p.hidden=false}break}
      const sign=cOf(e)<0n?-1n:1n;
      updateEntry(e.id,{c:(sign*q).toString()});S.editing=false;S.draft='';S.rollId=e.id;render(true);break;
    }
    case 'note':{
      const e=byId(S.sel);if(!e)break;
      S.delArm=false;S.editing='note';S.draft=e.note||'';render(true);focusEditor('noteInput',false);break;
    }
    case 'note-save':{
      const n=$('noteInput');const txt=(n?n.value:S.draft).trim().slice(0,300);
      updateEntry(S.sel,{note:txt});S.editing=false;S.draft='';render(true);break;
    }
    case 'edit-cancel':S.editing=false;S.draft='';render(true);break;
    case 'flip':{const e=byId(S.sel);if(e){updateEntry(e.id,{c:(-cOf(e)).toString()});S.delArm=false;S.rollId=e.id;render(true)}break}
    case 'combo-toggle':
      if(!S.comboMode){S.comboMode=true;S.combo=new Set([S.cur]);closeBk()}
      else{S.comboMode=false;if(S.view==='combo')S.view='book'}
      render(true);break;
    case 'combo-go':if(comboIds().length>=2){S.view='combo';S.sel=null;S.editing=false;S.enter=true;closeDrawer();render(true)}break;
    case 'combo-back':S.view='book';S.comboMode=false;S.enter=true;wantBottom=true;render(true);break;
    case 'export':doExport();break;
    case 'retry':S.err='';pushPending();render();break;
  }
}
document.addEventListener('click',ev=>{
  if(S.bk&&!ev.target.closest('#bkBubble')&&!(blp&&blp.fired&&Date.now()-blp.fired<900))closeBk();
  const el=ev.target.closest('[data-act]');
  if(el){act(el.dataset.act,el.dataset.id,el);return}
  const op=ev.target.closest('[data-open]');
  if(op){
    if(blp&&blp.fired&&Date.now()-blp.fired<900){blp=null;return}
    if(S.comboMode){const id=op.dataset.open;if(S.combo.has(id))S.combo.delete(id);else S.combo.add(id);render()}
    else openBook(op.dataset.open);
  }
});
document.addEventListener('change',ev=>{
  const c=ev.target.closest('[data-combo]');
  if(c){if(c.checked)S.combo.add(c.dataset.combo);else S.combo.delete(c.dataset.combo);render()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(S.dlg)closeDlg();
    else if(S.menu)closeMenu();
    else if(S.bk)closeBk();
    else if(S.trash)closeTrash();
    else if(S.drawer)act('drawer-close');
    else if(S.pick!=null)setPick(null);
    else if(S.editing){S.editing=false;S.draft='';render(true)}
    else if(S.sel)deselect();
  }
  if(ev.target.id==='amtInput'&&ev.key==='Enter'){ev.preventDefault();act('amt-save')}
  if(ev.target.id==='noteInput'&&ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();act('note-save')}
  if(ev.target.id==='retNum'&&ev.key==='Enter'){ev.preventDefault();act('ret-apply')}
});
document.addEventListener('input',ev=>{if(ev.target.id==='noteInput'||ev.target.id==='amtInput'){S.draft=ev.target.value;const p=$('amtErr');if(p)p.hidden=true}});

/* ---------- backup ---------- */
function ymd(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
async function doExport(){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    const data={app:'mangos',version:3,exportedAt:new Date().toISOString(),books:S.books,entries:S.entries};
    const fn='mangos-copia-'+ymd()+'.json',txt=JSON.stringify(data,null,1);
    if(dl)await dl.save({filename:fn,data:txt});
    else{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    toast('Copia lista.');
  }catch(e){
    if(!e||e.code!=='declined')toast('No se pudo descargar la copia.');
  }
}
function importData(txt){
  let d;
  try{d=JSON.parse(txt)}catch(e){toast('No se pudo leer el archivo.');return}
  if(!d||!Array.isArray(d.books)||!Array.isArray(d.entries)){toast('Ese archivo no es una copia de Mangos.');return}
  const okId=s=>typeof s==='string'&&/^[A-Za-z0-9_\-~:@+]{1,100}$/.test(s);
  const hb=new Set(S.books.map(b=>b.id)),he=new Set(S.entries.map(e=>e.id));
  let nb=0,ne=0;
  d.books.forEach(b=>{
    if(b&&okId(b.id)&&typeof b.name==='string'&&!hb.has(b.id)){
      const o=normB(b);o.name=o.name.slice(0,40);
      S.books.push(o);hb.add(o.id);putBook(o);nb++;
    }
  });
  d.entries.forEach(x=>{
    const o=okId(x&&x.id)&&hb.has(x.book)&&!he.has(x.id)?normE(x):null;
    if(o){o.note=o.note.slice(0,300);S.entries.push(o);he.add(o.id);putEntry(o);ne++}
  });
  sortBooks();ensureActive();lsSave();render(true);
  toast(ne||nb?'Se sumaron '+ne+' movimientos y '+nb+' apartados.':'No había nada nuevo para sumar.');
}
$('importFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{importData(String(r.result||''));ev.target.value=''};
  r.onerror=()=>{toast('No se pudo leer el archivo.');ev.target.value=''};
  r.readAsText(f);
});

/* ---------- splash ---------- */
function runSplash(){
  const sp=$('splash'),coin=$('spCoin');
  coin.innerHTML=logo('lgS',true);
  const sv=coin.querySelector('svg'),goo=$('lgSgoo');
  const px=coin.offsetWidth||132;
  sv.style.setProperty('--dx',Math.ceil((Math.max(window.innerWidth,360)/2)/(px/64))+36);
  $('spName').innerHTML=Array.from('Mangos').map((ch,i)=>'<span class="ch" aria-hidden="true" style="--i:'+i+'">'+ch+'</span>').join('');
  if(reduce()){if(goo)goo.style.display='none'}
  else{
    setTimeout(()=>{if(goo)goo.setAttribute('filter','url(#lgSf)')},430);
    setTimeout(()=>{if(goo)goo.style.display='none'},1500);
  }
  let done=false;
  const end=()=>{
    if(done)return;done=true;
    $('shell').classList.add('ready');
    S.enter=true;wantBottom=true;render(true);
    sp.classList.add('gone');
    setTimeout(()=>{if(sp.parentNode)sp.parentNode.removeChild(sp)},500);
  };
  sp.addEventListener('click',end);
  setTimeout(end,reduce()?500:2900);
}

/* ---------- boot ---------- */
$('menuBtn').innerHTML=ic.menu;
$('newBtn').innerHTML=ic.compose;
$('moreBtn').innerHTML=ic.more;
$('drawerClose').innerHTML=ic.close;
$('trashClose').innerHTML=ic.back;
$('drawerNew').innerHTML=ic.plus+'Nuevo apartado';
$('brand').innerHTML=logo('lgD')+'<b>Mangos</b>';
buildStrip();
const sv=lsLoad();
if(sv){
  S.books=Array.isArray(sv.books)?sv.books.filter(b=>b&&b.id&&typeof b.name==='string').map(normB):[];
  S.entries=(Array.isArray(sv.entries)?sv.entries:[]).map(normE).filter(Boolean);
  S.cur=sv.cur||null;
  if(typeof sv.trashDays==='number'&&sv.trashDays>=0)S.trashDays=sv.trashDays;
  (sv.pending||[]).forEach(p=>{
    if(!p||!p.o||!p.o.id)return;
    if(p.k==='e'){const o=normE(p.o);if(o)pending.set('e:'+o.id,{k:'e',o:o})}
    else if(p.k==='b'&&typeof p.o.name==='string'){const o=normB(p.o);pending.set('b:'+o.id,{k:'b',o:o})}
    else if(p.k==='p'&&typeof p.o.days==='number')pending.set('p:prefs',{k:'p',o:{id:'prefs',days:p.o.days}});
  });
}
sortBooks();ensureActive();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render(true);
runSplash();
initCloud();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
setInterval(purgeExpired,36e5);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderTotals(true));
})();
</script>
